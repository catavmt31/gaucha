<style>

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{

  }
  h1,h2,h3,.serif{ font-family:'Fraunces', serif; }

  header.top{

  }
  header.top .eyebrow{
    font-size:12px; letter-spacing:0.02em; color:var(--muted); margin:0 0 4px;
  }
  header.top h1{
    font-size:26px; font-weight:600; margin:0 0 6px; line-height:1.15;
  }
  header.top p.sub{
    margin:0; font-size:14px; color:var(--muted); max-width:480px;
  }

  .controls{
    padding:16px 20px 4px;
    display:flex; flex-direction:column; gap:12px;
  }
  .search-wrap{
    position:relative;
  }
  .search-wrap input{
    width:100%;
    padding:11px 14px 11px 38px;
    border:1px solid var(--line-strong);
    border-radius:8px;
    background:var(--card);
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
  }
  .search-wrap input:focus{
    outline:none; border-color:var(--ink);
  }
  .search-wrap svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; opacity:0.55;
  }
  .chips{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .chip{
    padding:7px 13px;
    border-radius:999px;
    border:1px solid var(--line-strong);
    background:transparent;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  main{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:16px;
  }
  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
  }
  .empty-state h3{ margin:0 0 6px; font-size:18px; }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--cat-color, var(--ink));
    border-radius:6px;
    padding:16px 16px 14px;
    cursor:pointer;
    position:relative;
    transition:border-color .15s ease;
  }
  .card:hover{ border-color: var(--line-strong); border-left-color: var(--cat-color, var(--ink)); }
  .card .cat-label{
    font-size:11px;
    text-transform:none;
    color:var(--cat-color, var(--ink));
    font-weight:600;
    margin:0 0 6px;
  }
  .card h3{
    font-size:19px; font-weight:600; margin:0 0 8px; line-height:1.25;
  }
  .card .meta{
    font-size:12.5px; color:var(--muted); margin:0 0 10px;
  }
  .card .ing-preview{
    font-size:13px; color:var(--ink); opacity:0.8; margin:0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card .comment-count{
    margin-top:12px; font-size:12px; color:var(--muted);
    display:flex; align-items:center; gap:5px;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(30,25,20,0.45);
    display:flex; justify-content:center; align-items:flex-start;
    padding:24px 12px; overflow-y:auto; z-index:20;
  }
  .overlay.hidden{ display:none; }
  .detail{
    background:var(--paper);
    max-width:640px; width:100%;
    border-radius:10px;
    border:1px solid var(--line-strong);
    padding:0 0 28px;
    margin-bottom:40px;
  }
  .detail-head{
    padding:22px 24px 18px;
    border-bottom:1px solid var(--line);
    border-top:5px solid var(--cat-color, var(--ink));
    border-radius:10px 10px 0 0;
    position:relative;
  }
  .detail-head .close{
    position:absolute; top:16px; right:16px;
    background:none; border:none; cursor:pointer;
    font-size:20px; color:var(--muted); line-height:1;
    padding:4px;
  }
  .detail-head .cat-label{ font-size:12px; font-weight:600; color:var(--cat-color, var(--ink)); margin:0 0 6px; }
  .detail-head h2{ font-size:24px; margin:0 0 8px; font-weight:600; }
  .detail-head .meta{ font-size:13px; color:var(--muted); margin:0; }

  .detail-body{ padding:20px 24px 4px; }
  .detail-body section{ margin-bottom:22px; }
  .detail-body h4{
    font-size:13px; text-transform:none; font-weight:600;
    color:var(--ink); margin:0 0 10px; padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .ing-group{ margin-bottom:12px; }
  .ing-group .grp-title{ font-size:12.5px; color:var(--muted); margin:0 0 4px; font-style:italic; }
  .ing-group ul{ margin:0; padding-left:18px; }
  .ing-group li{ font-size:14.5px; margin-bottom:4px; line-height:1.4; }

  .steps p{ font-size:14.5px; line-height:1.65; margin:0 0 12px; }
  .recipe-intro{ font-size:14.5px; line-height:1.65; margin:0 0 18px; color:var(--muted); font-style:italic; }

  .tech-note{
    background:rgba(139,58,43,0.08);
    border-left:3px solid var(--cat-color, var(--carnes));
    padding:12px 14px;
    border-radius:0 6px 6px 0;
    font-size:13.5px;
    line-height:1.55;
  }
  .tech-note strong{ display:block; font-size:12px; margin-bottom:4px; color:var(--cat-color, var(--carnes)); }

  .tip-gaucha{
    background:rgba(201,138,46,0.10);
    border-left:3px solid var(--arroces);
    padding:12px 14px;
    border-radius:0 6px 6px 0;
    font-size:13.5px;
    line-height:1.55;
    margin-top:12px;
  }
  .tip-gaucha strong{ display:block; font-size:12px; margin-bottom:6px; color:var(--arroces); }
  .tip-gaucha ul{ margin:0; padding-left:18px; }
  .tip-gaucha li{ margin-bottom:6px; }
  .tip-gaucha li:last-child{ margin-bottom:0; }

  .comments-section{ padding:18px 24px 0; }
  .comment{
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .comment:last-child{ border-bottom:none; }
  .comment .who{ font-size:13px; font-weight:600; margin:0 0 3px; }
  .comment .who span{ font-weight:400; color:var(--muted); margin-left:6px; font-size:12px; }
  .comment .txt{ font-size:14px; margin:0; line-height:1.5; }
  .no-comments{ font-size:13.5px; color:var(--muted); padding:8px 0; }

  .comment-form{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .comment-form input, .comment-form textarea, .comment-form select{
    border:1px solid var(--line-strong);
    border-radius:8px;
    padding:9px 12px;
    font-family:inherit;
    font-size:14px;
    background:var(--card);
    color:var(--ink);
    resize:vertical;
  }
  .comment-form select{
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232A231D' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:16px;
    padding-right:36px;
  }
  .comment-form textarea{ min-height:60px; }
  .comment-form button{
    align-self:flex-end;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:9px 18px;
    border-radius:8px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
  }
  .comment-form button:disabled{ opacity:0.5; cursor:default; }
  .form-note{ font-size:12px; color:var(--muted); }

  .view-toggle{
    display:flex; gap:8px; padding:14px 20px 0;
  }
  .view-btn{
    padding:8px 16px;
    border-radius:8px 8px 0 0;
    border:1px solid var(--line-strong);
    border-bottom:none;
    background:transparent;
    font-family:'Fraunces', serif;
    font-size:14px;
    font-weight:500;
    color:var(--muted);
    cursor:pointer;
  }
  .view-btn.active{
    background:var(--card);
    color:var(--ink);
  }
  .taller-head{ grid-column:1/-1; margin:14px 0 0; font-family:'Fraunces', serif; font-size:18px; font-weight:600; color:var(--ink); }
  .taller-head:first-child{ margin-top:0; }
  .taller-sub{ grid-column:1/-1; margin:4px 0 -4px; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .fund-section{ margin-bottom:18px; }
  .fund-section h5{
    font-size:13.5px; font-weight:600; margin:0 0 8px;
    color:var(--fundamentos);
  }
  .fund-section ul{ margin:0; padding-left:18px; }
  .fund-section li{ font-size:14px; line-height:1.55; margin-bottom:6px; }

  @media (max-width:480px){
    .view-toggle{ padding-left:16px; padding-right:16px; }
    header.top{ padding:22px 16px 14px; }
    header.top h1{ font-size:22px; }
    .controls, main{ padding-left:16px; padding-right:16px; }
    .detail-head, .detail-body, .comments-section{ padding-left:18px; padding-right:18px; }
  }
</style>

        'La sal cumple un papel fundamental: además de aportar sabor, modifica el ambiente microbiológico y contribuye a controlar el proceso.',
        'El resultado final depende del tipo y proporción de koji, la materia prima, la cantidad de sal, la humedad, la temperatura y el tiempo de maduración. Por eso no existe un único miso: existe un enorme universo de misos.',
        'El koji es la herramienta; el miso, una de sus posibles transformaciones. Miso = koji + legumbre + sal + agua + tiempo.',
      ] },
      { title:'05 · Aprender a formular', bullets:[
        'Una de las claves para dejar de seguir recetas y empezar a comprender una fermentación es aprender a pensar en proporciones.',
        'Koji: una mayor o menor proporción cambia la disponibilidad enzimática y puede modificar velocidad, dulzor y perfil aromático.',
        'Sal: no es solamente un condimento. Interviene directamente en la selección microbiana, la conservación y la evolución del fermento.',
        'Humedad: condiciona la textura y también la manera en que se desarrolla el proceso.',
        'Temperatura: afecta la actividad enzimática y microbiana.',
        'Tiempo: un miso joven y uno de larga maduración son productos sensorialmente muy diferentes.',
        'Formular = diseñar el resultado que queremos obtener.',
      ] },
      { title:'06 · Familias de miso', bullets:[
        'Hay una enorme diversidad según el koji utilizado, la materia prima y el tiempo de maduración.',
        'Kome miso: elaborado con koji de arroz. Mugi miso: elaborado con koji de cebada. Mame miso: elaborado principalmente a partir de soja.',
        'También se pueden pensar por su perfil sensorial: los jóvenes suelen ser más claros, suaves y frecuentemente más dulces; los madurados, más oscuros, profundos, complejos e intensos.',
        'La degustación comparativa permite comprender algo que la teoría sola no puede explicar: cómo el tiempo transforma el sabor.',
      ] },
      { title:'07 · Aminopastas', bullets:[
        'En la cocina contemporánea se utiliza el término aminopasta para describir ciertas pastas saladas en las que se aprovecha la actividad proteolítica del koji sobre ingredientes ricos en proteínas.',
        'No existe una única fórmula universal. Se puede trabajar, por ejemplo, con arvejas, garbanzos, lentejas, porotos, maní, semillas y otros ingredientes ricos en proteínas.',
        'Pregunta interesante para la cocina: ¿qué otros ingredientes podemos transformar utilizando la lógica del miso?',
        'Proteína + koji + sal + tiempo → péptidos + aminoácidos + sabor.',
      ] },
      { title:'08 · Shoyu: mucho más que “salsa de soja”', bullets:[
        'El shoyu tradicional japonés es el resultado de un proceso fermentativo complejo.',
        'Su elaboración comienza con un koji preparado habitualmente a partir de soja y trigo, que luego se combina con una salmuera. Esta mezcla recibe el nombre de moromi.',
        'Durante meses —y en algunas elaboraciones durante períodos considerablemente más largos— las enzimas y microorganismos transforman progresivamente las materias primas. Finalmente el moromi se prensa y el líquido obtenido continúa su proceso hasta convertirse en shoyu.',
        'En el taller se trabaja: qué diferencia a un shoyu fermentado de muchas salsas industriales; cómo se construye el koji específico para shoyu; qué es el moromi; qué sucede durante la maduración; cómo influyen concentración, agua, sal y tiempo; y cómo reconocer distintos perfiles de salsa de soja.',
        'Se inicia una elaboración de shoyu para continuar observando su transformación en el tiempo.',
      ] },
      { title:'09 · Shio koji: cocinar con enzimas', bullets:[
        'Combina koji, sal y agua. Es al mismo tiempo un condimento y una herramienta enzimática.',
        'Puede utilizarse para marinar, condimentar, aportar umami, favorecer cambios de textura y construir profundidad de sabor.',
        'Sus enzimas continúan actuando cuando entran en contacto con otros alimentos; por eso resulta particularmente interesante aplicado a carnes, pescados y vegetales.',
        'Más no siempre significa mejor: cantidad, temperatura y tiempo de contacto deben adaptarse al alimento.',
        'Shio koji = koji + sal + agua.',
      ] },
      { title:'10 · Degustar para comprender', bullets:[
        'Parte de aprender fermentación es aprender a probar. En el taller se comparan diferentes elaboraciones para reconocer salinidad, dulzor, umami, acidez, aroma, textura y tiempo.',
        'No se busca decidir cuál es “mejor”, sino construir un vocabulario sensorial para poder cocinar con ellas.',
      ] },
      { title:'11 · Del fermento al plato', bullets:[
        'Entender una fermentación tiene sentido cuando se puede incorporar a la propia cocina.',
        'Miso, shio koji, shoyu y aminopastas pueden funcionar como condimento, marinada, base de una salsa, aderezo, glaseado, fondo de sabor, elemento de contraste, potenciador del umami o ingrediente de una preparación dulce.',
        'El desafío no es que todo “tenga gusto a miso”: es aprender a utilizar pequeñas cantidades para construir capas de sabor.',
      ] },
      { title:'12 · Leer el menú a través de la fermentación', bullets:[
        'El menú de la jornada funciona también como una herramienta de aprendizaje.',
        'Entrada: espárragos lactofermentados · arvejas asadas · reducción de tamari de maní · pangrattato · rabanitos frescos. La lactofermentación aporta acidez y complejidad; el tamari introduce concentración y umami; los elementos frescos permiten observar el contraste entre transformación y materia prima.',
        'Principal: albóndigas de carne roja con shio koji y ajo · hummus de arvejas con miso de arvejas · arroz urumati · huevo frito · kimchi. El shio koji aparece como herramienta enzimática y condimento; el miso de arvejas muestra cómo trasladar la lógica del miso a ingredientes diferentes de la soja; el kimchi incorpora otra familia de fermentación y aporta acidez, frescura y complejidad.',
        'Postre: tarta de chocolate y trigo sarraceno · caramelo de miso. Sal, dulzor, fermentación y umami se encuentran en un contexto dulce; el miso deja de funcionar como protagonista evidente para convertirse en una capa más de profundidad.',
        'Para terminar: fruta de estación · aceite de oliva · sal. Una pequeña exploración del umami natural y una vuelta al alimento casi sin transformar: después de atravesar fermentación, enzimas, maduración y tiempo, se termina nuevamente frente a la materia prima.',
      ] },
      { title:'13 · Koji + otros fermentos', bullets:[
        'El koji no reemplaza otras formas de fermentación; puede convivir con ellas. Entender las diferencias permite decidir qué herramienta utilizar y para qué.',
        'Koji — aporta enzimas + transformación. Ejemplo / uso: miso, shoyu, amazake.',
        'Shio koji — aporta condimento + actividad enzimática. Ejemplo / uso: marinadas, vegetales, carnes, salsas.',
        'Miso — aporta transformación + fermentación + maduración. Ejemplo / uso: caldos, salsas, aderezos, glaseados, dulces.',
        'Aminopastas — aportan proteólisis + concentración de sabor. Ejemplo / uso: condimentos y bases culinarias.',
        'Lactofermentación — aporta ácidos orgánicos + transformación microbiana. Ejemplo / uso: vegetales, kimchi y otros fermentos.',
      ] },
      { title:'14 · Cuidar lo que nos llevamos', bullets:[
        'Un fermento no termina cuando termina el taller: empieza. Registrar su evolución permite aprender de él.',
        'Observar: día 0 · día 3 · día 7 · día 14 · día 30 · y luego una vez por mes.',
        'Qué registrar: cambios de color, aromas, presencia de líquido, textura, temperatura aproximada y cualquier cambio inesperado.',
        'No probar una preparación cuando existan dudas sobre su inocuidad. La observación y el registro son parte del aprendizaje.',
      ] },
      { title:'15 · Para recordar', bullets:[
        'Koji: microorganismo + sustrato + cultivo controlado.',
        'Enzimas: herramientas biológicas capaces de transformar moléculas.',
        'Proteólisis: proteínas → péptidos → aminoácidos.',
        'Amilólisis: almidones → azúcares más simples.',
        'Umami: percepción gustativa asociada, entre otros compuestos, al glutamato.',
        'Miso: koji + materia prima + sal + tiempo.',
        'Shoyu: koji + salmuera + fermentación + maduración + prensado.',
        'Shio koji: koji + agua + sal, utilizado como condimento y herramienta enzimática.',
        'Fermentar: diseñar condiciones para que microorganismos, enzimas y tiempo transformen una materia prima.',
        'Cocinar con koji = comprender la transformación para poder crear.',
      ] },
      { title:'Ideas para preparaciones con miso y koji', bullets:[
        'El objetivo no es pensar el miso y el koji como ingredientes aislados, sino como herramientas para construir sabor, modificar texturas y potenciar materias primas.',
        'Carnes y pescados: marinadas con shio koji para aportar sabor, jugosidad y mejorar textura.',
        'Vegetales: glaseados de miso, mantecas de miso, vegetales asados terminados con miso o koji.',
        'Legumbres: hummus y purés con miso; misos de arvejas, garbanzos, porotos o maní.',
        'Arroces y cereales: condimentar arroces, risottos, bowls y rellenos con miso o shio koji.',
        'Salsas y aderezos: vinagretas, mayonesas, emulsiones, dips y salsas con miso.',
        'Caldos y sopas: incorporar miso al final de la cocción para sumar profundidad y umami.',
        'Huevos: marinados, revueltos o acompañados con manteca de miso.',
        'Panificados: usar miso en masas, rellenos, mantecas y terminaciones.',
        'Dulces: caramelo de miso, chocolate y miso, cookies, tartas, helados y cremas.',
        'Frutas: combinar miso con frutas de estación, especialmente en preparaciones asadas o caramelizadas.',
        'Fermentos propios: experimentar con diferentes materias primas, proporciones de koji y tiempos de maduración. Observar · registrar · probar · esperar: en fermentación, la receta es apenas el punto de partida.',
      ] },
      { title:'Ficha práctica de formulación y bitácora', bullets:[
        'Ficha de formulación (registrar la formulación permite comparar resultados y aprender de cada proceso): preparación / nombre · fecha de inicio · sustrato / materia prima · tipo de koji · peso de materia prima · peso de koji · peso de sal · agua / hidratación · porcentaje de sal · temperatura prevista · tiempo de maduración previsto · objetivo sensorial · notas de formulación.',
        'Bitácora de seguimiento (observar, registrar y comparar; no se busca controlar todo, sino aprender a leer el proceso): para cada momento —día 0, 3, 7, 14, 30, mes 2, mes 3 y mes 6— anotar color, aroma, textura, líquido y observaciones.',
        'Registro sensorial final: aroma · salinidad · dulzor · umami · acidez · textura · qué cambiaría en la próxima formulación.',
      ] },
      { title:'Anotaciones de clase (a mano)', bullets:[
        'Aspergillus flavus → hongo tóxico domesticado → Aspergillus oryzae (lectura de la anotación; confirmar la primera palabra).',
        'Espora para inocular cereal. Espora → arroz → koji.',
        'El miso es solo de soja (poroto de soja). Aminopasta es más genérico: si no es soja, no se le dice miso.',
        'Grano pulido, sin cascarilla, para que la espora entre. El grano al dente: no se puede pasar de punto porque, si no, se ahoga la espora.',
        '1 kg de arroz seco → 1 g de espora. Empezar con poco (la cantidad se lee “100 gr” de arroz; confirmar).',
        'Cocinar el arroz 1:1; lavado y remojado (lectura incierta). El arroz debe estar frío para poner la espora.',
      ] },
      { title:'Fuentes de consulta (del librillo)', bullets:[
        'Japanese Traditional Miso and Koji Making — Journal of Fungi.',
        'Koji Molds for Japanese Soy Sauce Brewing: Characteristics and Key Enzymes — Foods.',
        'The ancient koji mold (Aspergillus oryzae) as a modern biotechnological tool.',
        'Induction and Repression of Hydrolase Genes in Aspergillus oryzae — Frontiers in Microbiology.',
        'Research advances on sake rice, koji, and sake yeast: A review — Food Science & Nutrition.',
        'Nota del librillo: el término culinario “aminopasta” y sus formulaciones varían entre cocineros, productores y proyectos. En esta bitácora se utiliza para explicar el principio general de transformación proteolítica mediante koji y no como denominación de una receta única.',
      ] },

  {
    id:'laminados-conceptos',
    title:'Laminados: conceptos',
    classInfo:'Taller de laminados · Franco Fonseca',
    sections:[
      { title:'Presentación del taller', bullets:[
        'Entender que la gastronomía muchas veces no se reduce a una receta es más complejo de lo que parece: el desafío y la ganancia están en algo tan básico como la prueba y error.',
        'Tener la técnica no es suficiente si no sabemos cómo funcionan los ingredientes y, de la misma manera, tener la mejor materia prima no basta si no sabemos cómo trabajarla.',
        'La idea del taller es fomentar la curiosidad por los laminados y familiarizarse con su elaboración.',
      ]},
      { title:'¿Qué es un laminado?', bullets:[
        'Los dos ítems que componen un laminado son amasijo y empaste. Al autor le gusta agregar el tiempo como un tercer componente.',
        'Dentro de ese concepto (amasijo, empaste, tiempo) no es lo mismo un hojaldre rápido, un hojaldre clásico francés, o una pieza de bollería, bizcochería o viennoiserie.',
        'Existen diferentes técnicas para laminar y cada una lleva a un producto diferente: hay que tener en cuenta a qué apuntamos y con qué herramientas contamos.',
        'Laminamos cuando, aplicando la técnica adecuada, logramos que un empaste interfiera y separe capas de masa, desarrollando el volumen de la pieza en la cocción y generando láminas de masa muy finas en el interior.',
      ]},
      { title:'¿Por qué crece la masa al cocinarse?', bullets:[
        'Masas con levaduras (medialunas, croissant, etc.): crece por acción física y biológica.',
        'Masas sin fermentos (palmeritas, jesuitas, pasteles): crece solo por acción física.',
        'Desarrollo físico: se da por la superposición de amasijo y empaste. Cuando el agua presente en el amasijo se transforma en vapor y quiere escapar, el empaste interfiere empujando la siguiente capa de masa, y así sucesivamente.',
        'Desarrollo biológico: cuando el amasijo lleva algún fermento, hay que lograr que la masa llegue a la cocción en el punto justo de levado. Respetar tiempos y temperaturas durante el laminado es clave para que no se fermente antes de tiempo y se pierda calidad.',
      ]},
      { title:'Los componentes', bullets:[
        'Amasijo: harina, agua, sal y opcionalmente algún fermento. Se puede enriquecer (azúcar, manteca, huevos, leche, etc.) buscando la hidratación adecuada para optimizar el proceso.',
        'Empaste: principalmente alguna materia grasa (manteca, margarina, grasa refinada, aceite); puede llevar harina o almidón para facilitar la extensibilidad de la materia grasa.',
        'Tiempo: junto con la temperatura ambiente determina qué proceso hay que realizar. Por ejemplo, para hacer medialunas en el día seguramente haya que modificar la receta, ni que hablar si hace calor. Agregar harina al empaste o usar un porcentaje de margarina es lo que se suele hacer, pero también se traduce en perder calidad en el producto final.',
        'Inclusión: el camino para superponer amasijo y empaste. Una vez hecha la inclusión, a la masa se la llama "pastón" o "bastón".',
      ]},
      { title:'Métodos de inclusión', bullets:[
        'Directo: el amasijo envuelve al empaste y se da una serie de vueltas o pliegues para lograr el hojaldrado (medialunas, palmeras, bizcochos, masa de tartas o pasteles).',
        'Invertido: el empaste envuelve al amasijo; se necesita trabajar con harina en el empaste y en lo posible con laminadora. Tiene una cantidad más grande de materia grasa y queda expuesta al calor de forma más directa, por lo que se nota más el sabor tostado del empaste. No se suele usar en Uruguay; en Francia e Italia se usa mucho para el napoleón y el milhojas.',
        'Rápido: la harina va desde el comienzo con los líquidos y la materia grasa, se trabaja en frío y se da una serie de pliegues. Da una masa sin tanto detalle de hojaldrado, pero bien crocante y en poco tiempo (clásica masa de tarta o pie americano).',
        'En el taller se trabaja con medialunas de manteca. Un punto clave es usar manteca pura en el empaste, de buena calidad, que no haya sido congelada ni derretida: lleva más trabajo, pero se traduce en calidad en el producto final.',
      ]},
      { title:'Medialuna y croissant', bullets:[
        'No son lo mismo: son piezas parecidas a la vista y una deriva de la otra, pero no es simplemente la forma lo que las diferencia.',
        'Croissant clásico francés: se busca una pieza liviana y aireada, crocante por fuera y con mucho sabor a manteca. No se suele enriquecer la masa con tantos ingredientes; es protagonista la pura manteca del empaste.',
        'Medialuna: deriva del croissant pero se adaptó al paladar rioplatense. Se enriquece la masa con azúcar, miel, huevos y leche priorizando la humedad, y se agrega almíbar y/o jalea para "amigarnos" con el dulzor.',
        'Las medialunas se cocinan muy juntas entre sí y se pintan con almíbar en seguida que salen del horno. La humedad es lo más buscado en la medialuna.',
      ]},
    ],
  },
  {
    id:'laminados-proceso',
    title:'Laminados: proceso paso a paso',
    classInfo:'Taller de laminados · Franco Fonseca',
    sections:[
      { title:'Las etapas', bullets:[
        'Amasado',
        'Fermentación en bloque (en frío)',
        'Inclusión',
        'Laminado (vueltas)',
        'Porcionado',
        'Armado',
        'Fermentación final (calor)',
        'Doradura',
        'Cocción',
      ]},
      { title:'Amasado en amasadora', bullets:[
        'Existen amasadoras de gancho tipo espiral, de horquilla, de brazos, etc., y cada máquina trabaja a distintas revoluciones y genera una fricción y una temperatura diferentes: es imposible estandarizar el tiempo de amasado. Los tiempos que siguen son para una amasadora estándar con gancho de espiral, de dos velocidades.',
        'Lo ideal es pesar los ingredientes y reservar en frío hasta el momento de amasar, o usar parte de los líquidos congelados.',
        'Incorporar todos los ingredientes menos la manteca y amasar en velocidad baja hasta que no haya nada seco (aprox. 5 min).',
        'Dejar la masa en frío durante 15–30 min aprox. (autolisis) para que las harinas se terminen de hidratar y se logre una mejor estructura de gluten.',
        'Llevar de nuevo a la amasadora, agregar la manteca fría y amasar en velocidad media/rápida (aprox. 8 min) hasta alcanzar 21–23 °C.',
      ]},
      { title:'Amasado a mano', bullets:[
        'Idealmente pesar los ingredientes y reservar en frío hasta el momento de amasar.',
        'En un bowl mezclar todos los ingredientes menos la manteca, revolviendo hasta que no haya nada seco. Llevar a la heladera y dejar 15–30 min aprox. (autolisis).',
        'Agregar la manteca blanda y amasar de manera tradicional: al principio desgarrando para que la manteca se integre, y luego girando la masa sobre sí misma sin desgarrar hasta tener un amasijo bastante liso. Con termómetro, el ideal es 21–23 °C.',
        'Una vez amasado, a mano o en amasadora, formar un bollo y dejar 10 min aprox. o hasta que haya perdido tenacidad.',
      ]},
      { title:'Fermentación en bloque', bullets:[
        'Es el descanso del amasijo previo al laminado: se necesitan varias horas para que la masa esté lo suficientemente relajada como para estirarse, plegarse y volverse a estirar.',
        'Se hace en frío por varias razones. Evitar volumen: las levaduras trabajan mejor a una temperatura más cálida; si no se cuida el frío durante la primera fermentación, la masa se gasifica y crece en volumen, y eso dificulta el laminado.',
        'Plasticidad: una masa fría es más consistente y plástica; si el amasijo tiene manteca o grasa, estas se endurecen en la heladera, y resulta una masa con más cuerpo y más cómoda para laminar.',
        'Sabor: siempre que en panadería se respetan las fermentaciones largas en frío, se desarrollan sabores y colores más intensos en la pieza final.',
        'Hay que frenar la actividad de la levadura hasta formar la pieza final: si el amasijo se fermenta antes de tiempo, se complica el laminado y se pierde calidad.',
      ]},
      { title:'Trabar la masa', bullets:[
        'Con ayuda de un palote o una sobadora, estirar la masa de manera rectangular, fina y uniforme: a esto se le llama TRABAR LA MASA. Así, al llevarla a descansar a la heladera, el frío llega a la totalidad de la masa de forma pareja y se frena la actividad de la levadura lo más rápido posible.',
        'Si se llevara a la heladera el bloque hecho un bollo, el corazón de la masa tendría más temperatura que la superficie y las levaduras trabajarían de manera diferente en distintos puntos.',
        'Una vez en la heladera, cubierta con nylon, dejar descansar idealmente entre 12 y 24 h.',
        'Se puede dar un golpe de 1 o 2 hs de freezer luego de trabar la masa, previo al descanso en bloque, para frenar la actividad de las levaduras.',
        'Siempre guardar con un nylon en contacto: si el amasijo se seca por el contacto con el aire, a la hora de estirarlo queda "estriado".',
        'Anotación de clase: no fermentar antes de laminar.',
      ]},
      { title:'El amasijo', bullets:[
        'No debe ser muy blando: por lo general entre 57% y 61% de hidratación (de grasas y líquidos totales sobre la harina). Si se pasa de hidratación es probable que se rompa la masa durante el laminado y se pierdan capas; si queda muy seca, es probable que no se deje estirar tan fácil e incluso se desgarre.',
        'Regular la levadura en base al lugar donde se hace el proceso: si hace calor o la heladera no enfría tanto, bajar la cantidad de levadura, o viceversa.',
        'Regular la materia grasa del amasijo: cuanta más materia grasa, más consistencia toma en frío, y eso ayuda. Pero un exceso puede interferir en la plasticidad de la masa; por lo general se usa entre 8 y 15% sobre la totalidad de la harina.',
      ]},
      { title:'El empaste', bullets:[
        'Usar 100% manteca.',
        'Es más práctico encuadrar con la manteca pomada y luego mandar al frío.',
        'Encuadrar prolijo, de grosor uniforme no mayor a 1 cm y con los vértices bien marcados. Anotación de clase: 1/2 cm de espesor.',
        'Temperatura: 12 a 15 °C. A la vista sería cuando la manteca está "flexible" o "maleable".',
      ]},
      { title:'Inclusión', bullets:[
        'Hay que intentar equiparar la consistencia del amasijo respecto al empaste, para que al estirar el pastón ambas partes corran en paralelo.',
        'Para eso se recomienda usar la masa bien fría (0 a 5 °C) y el empaste templado (12 a 15 °C). Así, una vez integradas las dos partes, el pastón queda aprox. entre 6 y 10 °C, temperatura ideal para laminar.',
      ]},
      { title:'Las vueltas (pliegues)', bullets:[
        'La vuelta o pliegue es el proceso para multiplicar y afinar las láminas de manteca y masa.',
        'Masas con fermentos (medialuna, croissant): cuidar de no afinar tanto las capas, para evitar que al leudar la masa rompa el hojaldrado, y permitir que la pieza crezca tanto por el desarrollo físico como por los gases de la levadura. Lo recomendable es dar entre 2 y 3 vueltas, o, para ser más preciso, mínimo 19 láminas y máximo 55.',
        'Laminados sin fermentos (jesuitas, palmeritas, etc.): dependen únicamente del desarrollo físico para lograr volumen; se recomiendan 4 vueltas cuidando que el pastón no se rompa y unifique el amasijo con el empaste.',
        'Milhojas clásico francés: 5 a 6 vueltas para tener literalmente más de mil hojas; antes de hornear se pincha con una "pica" o tenedor para que crezca parejo.',
        'IMPORTANTE: siempre trabajar con harina sobre la mesada, más aún si se lamina a mano; si la masa se engancha a la mesa corre riesgo de romperse. La cara que mira hacia arriba no debe tener harina: ayudarse con un cepillo o pincel para quitar los excesos antes de plegar.',
        'Al estirar, antes de doblar, cortar los extremos del pastón procurando que se vea "masa, manteca, masa", en cada vuelta. Esos recortes se guardan y SIEMPRE se pueden volver a usar en otra receta.',
        'Hecha la vuelta y antes de llevar a la heladera, bajar el pastón a un espesor de no más de 1,5 cm. Igual que al "trabar la masa", el pastón tiene que tener la misma temperatura de manera pareja.',
        'Cuidado con los excesos: si al laminar se lleva demasiado fino el pastón, se corre riesgo de que el empaste y el amasijo se unifiquen y se pierdan láminas.',
      ]},
      { title:'Vuelta simple (x3)', bullets:[
        'Cómo saber cuántas láminas tiene la pieza: el pastón parte compuesto por masa, manteca, masa. Cada vuelta simple multiplica x3 la lámina de manteca; las láminas de masa siempre son las de manteca más 1.',
        'Dos vueltas simples: 9 capas de manteca (1×3×3). Tres vueltas simples: 27 capas (1×3×3×3).',
        'Tabla (láminas de manteca / masa / totales): amasijo + empaste 1 / 2 / 3; 1 vuelta simple 3 / 4 / 7; 2 vueltas simples 9 / 10 / 19; 6 vueltas simples (milhojas) 729 / 730 / 1459.',
        'Cómo se hace: estirar el pastón en forma de rectángulo, dividirlo imaginariamente en 3 (A, B y C) y realizar los dobleces del esquema del cuadernillo, que dejan el pastón en 3 capas (el esquema no se transcribe aquí).',
        'Cada vuelta le da tenacidad al pastón: entre vuelta y vuelta conviene dejar descansar 20–30 min en frío.',

      { title:'Vuelta doble (x4)', bullets:[

        'Cómo se hace: estirar el pastón en forma de rectángulo, dividirlo imaginariamente en 4 (A, B, C y D) y realizar los dobleces del esquema del cuadernillo (el esquema no se transcribe aquí).',
        'Entre vuelta y vuelta, dejar descansar 20–30 min en frío.',
        'Terminadas las vueltas, el pastón queda tenso: mandarlo al frío respetando el mismo grosor con el que se venía trabajando. Descansar en frío (mínimo media hora) y queda listo para estirar y porcionar.',
      ]},
      { title:'Porcionado y armado', bullets:[
        'Determina la forma y el peso de la pieza; hay que tener en cuenta el grosor al que se lleva el pastón antes del corte.',
        'Primero llevar al grosor deseado; después descubrir el hojaldre (cortar los extremos de todos los lados) y por último marcar la medida y cortar.',
        'Croissant grande 90–100 g: pastón a 3 mm, cortes de 9 × 30 cm.',
        'Croissant chico 55–60 g: pastón a 3 mm, cortes de 7 × 25 cm.',
        'Medialuna grande 120 g: pastón a 5 mm, triángulos de 12 × 20 cm.',
        'Medialuna chica 60–65 g: pastón a 3 mm, triángulos de 9 × 24 cm.',
        'A la medialuna se la corta con más base, para que al enrollar queden "patitas" más grandes. Si se quieren más vueltas se puede estirar la pieza hasta el doble de largo, cuidando que las láminas de manteca no se cuarteen; si pasa, dejar templar el triángulo antes de estirar.',
        'En el croissant clásico se da más altura, para enrollar más veces y conseguir más vueltas o "anillos". Todo puede variar según la comodidad de cada uno y la pieza final; con sobadora o laminadora, acomodar el tamaño de pastón y piezas para tener menos recortes.',
        'Todos los recortes se guardan para aprovechar en otra receta.',
      ]},
      { title:'Fermentación final', bullets:[
        'Aquí nos olvidamos del frío: es cuestión de esperar agregando o no temperatura y humedad. Se puede fermentar a temperatura ambiente, en un cuarto calefaccionado o en fermentadora.',
        'El ambiente no debe superar los 28 °C: por encima de esa temperatura la manteca se funde y escapa de la pieza.',
        'Este es el momento justo para congelar si hay que guardar piezas sin cocinar: PREVIO A LA FERMENTACIÓN FINAL. Para fermentar una pieza congelada: pasar del freezer a la heladera y, una vez descongelada, pasar al leudado final.',
        'A temperatura ambiente: la más fácil en casa; se adapta el tiempo a la temperatura del ambiente (es la menos estandarizable). Hay que tapar las piezas con nylon para que no se seque la superficie ni se cuarteen. Hay problemas si el ambiente está a menos de 15 °C o a más de 28 °C: hay que recurrir a calefacción o refrigeración.',
        'Cuarto calefaccionado: se pueden regular los excesos de calor o frío con algún aparato (por ejemplo aire acondicionado); también hay que tapar con nylon. Con aire acondicionado, cuidado con el calor directo: no es lo mismo fermentar a 2 m del aire que directamente abajo.',
        'Máquinas fermentadoras: por amplio margen la mejor opción en una panadería, la más controlable. Se puede agregar humedad y no hace falta tapar con nylon; las hay con frío y calor, programables para que toda la tanda llegue a una temperatura y fermente la misma cantidad de tiempo. Es lo más caro, pero amerita la inversión si se prioriza la estandarización y la calidad.',
        'Punto justo de leudado: prueba y error. Idealmente el volumen debería haberse incrementado entre 2 y 2,5 veces desde que se formó la pieza, pero es muy difícil acertar el punto exacto: alguna vez nos vamos a quedar cortos y otras nos vamos a pasar. Lo que sí se puede hacer es reconocer los errores para no repetirlos.',
      ]},
      { title:'Doradura', bullets:[
        'Yema o huevo batido: da brillo y profundidad de color, y aporta humedad para que la pieza desarrolle volumen y no se seque antes de tiempo o quede opaca. La superficie donde se pasa doradura queda más crujiente.',
        'Se puede poner antes o después de fermentar; se recomienda después, para no exponer el huevo al calor por tanto tiempo.',
        'Se usa con pincel o con pulverizador (sirve para no pinchar ni deformar la pieza ya leudada y frágil). Si se hace a granel, conviene tamizarla para que corra más fácil.',
        'Se puede agregar agua, leche, crema de leche, sal y/o azúcar para ayudar a romper la estructura del huevo y lograr diferentes resultados de color una vez cocido.',
      ]},
      { title:'Horneado', bullets:[
        'El final del proceso: un buen horneado es clave para que la pieza luzca todo el trabajo anterior.',
        'Lo ideal: horno eléctrico convector a 170 °C con vapor durante por lo menos un minuto; después de 5 minutos de cocción, prender el ventilador.',
        'El tiempo total varía según qué tan cargada esté la bandeja y cuántas bandejas vayan al horno. Piezas separadas entre sí: 15 a 20 min según el peso. Piezas juntas (por ej. medialunas): 25 a 35 min según el peso.',
        'En casa se puede simular el vapor tirando un cubito de hielo en alguna parte del horno, o rociando las piezas con agua antes de cocinar.',
        'Si se va a cocinar a 170 °C, lo ideal es precalentar el horno por encima de los 200 °C: al abrir la puerta y al meter una bandeja fría se pierde temperatura. Si no se precalienta bien, la temperatura baja un montón y la manteca se escapa de la pieza, perdiendo calidad.',
      ]},
      { title:'Resumen en 48 horas (dos opciones)', bullets:[
        'La masa se puede adaptar a mis tiempos y no al revés.',
        'Opción 1. Día 1: amasado y dejar en frío. Día 2: inclusión y vuelta doble; descanso en frío 30 min; vuelta simple; descanso en frío; estirar, cortar y armar; dejar leudando. Día 3: cocinar.',
        'Opción 2. Día 1: amasado y dejar en frío. Día 2: inclusión y vuelta doble; descanso en frío 30 min; vuelta simple; descanso en frío; estirar y cortar; dejar en frío. Día 3: sacar a templar; armar; dejar leudando; cocinar.',
      ]},
    ],

function normalize(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
const TALLERES = [
  { id:'pasteleria', label:'Pastelería con frutas de invierno', guest:'Mica Daverede', re:/Taller de pastelería con frutas/ },
  { id:'pesca',      label:'Pesca local',                        guest:'Mauricio Molina', re:/Taller de pesca local/ },
  { id:'miso',       label:'Fermentados: miso y koji',           guest:'Giselle Brañas', re:/Miso & Koji/ },
  { id:'laminados',  label:'Laminados',                          guest:'Franco Fonseca', re:/Taller de laminados/ },
  { id:'picada',     label:'Picada oriental y vermut',           guest:'', re:/Taller de picada oriental/ },
  { id:'sopas',      label:'Sopas',                              guest:'', re:/Taller de sopas/ },
];
function tallerOf(item){ const t = TALLERES.find(t=>t.re.test(item.classInfo||'')); return t ? t.id : null; }
function categoryOf(id){ return CATEGORIES.find(c=>c.id===id); }
// Una receta puede estar en varias categorías: 'category' es la principal (define el color)
// y 'categories' (opcional) lista todas, incluida la principal.
function recipeCats(r){ return (r.categories && r.categories.length) ? r.categories : [r.category]; }
function recipeCatLabel(r){ return recipeCats(r).map(id=>{ const c=categoryOf(id); return c ? c.label : ''; }).filter(Boolean).join(' · '); }
function ingredientsText(recipe){
  return normalize(recipe.ingredientGroups.map(g=>g.items.join(' ')).join(' '));
}

let activeCategory = 'all';
let searchTerm = '';
let currentRecipeId = null;
let currentView = 'recetas';
let activeTaller = 'all';

const gridEl = document.getElementById('grid');
const chipsEl = document.getElementById('categoryChips');
const overlayEl = document.getElementById('overlay');
const detailEl = document.getElementById('detailPanel');
const searchInput = document.getElementById('searchInput');
const viewToggleEl = document.getElementById('viewToggle');
const controlsBarEl = document.getElementById('controlsBar');

function renderChips(){
  if(currentView === 'talleres'){
    const allT = `<button class="chip ${activeTaller==='all'?'active':''}" data-taller="all">Todos</button>`;
    const tChips = TALLERES.map(t=>`<button class="chip ${activeTaller===t.id?'active':''}" data-taller="${t.id}">${t.label}</button>`).join('');
    chipsEl.innerHTML = allT + tChips;
    chipsEl.querySelectorAll('.chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        activeTaller = btn.dataset.taller;
        renderChips();
        renderView();
      });
    });
    return;
  }
  const usedCats = new Set();
  RECIPES.filter(r=>!tallerOf(r)).forEach(r=>recipeCats(r).forEach(c=>usedCats.add(c)));
  const allChip = `<button class="chip ${activeCategory==='all'?'active':''}" data-cat="all">Todas</button>`;
  const chips = CATEGORIES.filter(c=>usedCats.has(c.id)).map(c=>`<button class="chip ${activeCategory===c.id?'active':''}" data-cat="${c.id}">${c.label}</button>`).join('');
  chipsEl.innerHTML = allChip + chips;
  chipsEl.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCategory = btn.dataset.cat;
      renderChips();
      renderView();
    });
  });
}

viewToggleEl.querySelectorAll('.view-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentView = btn.dataset.view;
    viewToggleEl.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active', b===btn));
    controlsBarEl.style.display = currentView === 'fundamentos' ? 'none' : 'flex';
    controlsBarEl.style.flexDirection = 'column';
    renderChips();
    renderView();
  });
});

function renderView(){
  if(currentView === 'recetas'){
    renderGrid();
  } else if(currentView === 'talleres'){
    renderTalleresGrid();
  } else {
    renderFundamentosGrid();
  }
}

function renderFundamentosGrid(){
  const FUNDS = FUNDAMENTOS.filter(f=>!tallerOf(f));
  if(FUNDS.length === 0){
    gridEl.innerHTML = `<div class="empty-state"><h3>Todavía no hay fundamentos cargados</h3><p>Se van a ir sumando a medida que suban las clases teóricas.</p></div>`;
    return;
  }
  gridEl.innerHTML = FUNDS.map(f=>{
    const preview = f.sections.map(s=>s.title).join(' · ');
    return `
      <div class="card" style="--cat-color:var(--fundamentos)" data-fund-id="${f.id}">
        <p class="cat-label">Fundamentos</p>
        <h3>${f.title}</h3>
        <p class="meta">${f.classInfo}</p>
        <p class="ing-preview">${preview}</p>
        <p class="comment-count" data-count-for="${f.id}"></p>
      </div>
    `;
  }).join('');

  gridEl.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=> openFundamentoDetail(card.dataset.fundId));
  });

  FUNDS.forEach(async f=>{
    const n = await commentCount(f.id);
    const el = gridEl.querySelector(`[data-count-for="${f.id}"]`);
    if(el) el.textContent = n===0 ? 'Sin comentarios todavía' : (n===1 ? '1 comentario' : n+' comentarios');
  });
}

async function openFundamentoDetail(id){
  const fund = FUNDAMENTOS.find(f=>f.id===id);
  if(!fund) return;
  currentRecipeId = id;

  const sectionsHtml = fund.sections.map(s=>`
    <div class="fund-section">
      <h5>${s.title}</h5>
      <ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
    </div>
  `).join('');

  detailEl.innerHTML = `
    <div class="detail-head" style="--cat-color:var(--fundamentos)">
      <button class="close" id="closeBtn" aria-label="Cerrar">&times;</button>
      <p class="cat-label">Fundamentos</p>
      <h2>${fund.title}</h2>
      <p class="meta">${fund.classInfo}</p>
    </div>
    <div class="detail-body">
      ${sectionsHtml}
    </div>
    <div class="comments-section">
      <h4 style="border:none; margin-bottom:12px;">Comentarios de la clase</h4>
      <div id="commentsList"></div>
      <div class="comment-form">
        <select id="commentName">
          <option value="" disabled selected>Elegí tu nombre</option>
          ${COMMENTERS.map(n=>`<option value="${n}">${n}</option>`).join('')}
        </select>
        <textarea id="commentText" placeholder="Dudas, aportes, lo que quieras sumar..."></textarea>
        <p class="form-note" id="formError" style="display:none; color:#8B3A2B;"></p>
        <button id="submitComment">Comentar</button>
      </div>
    </div>
  `;

  document.getElementById('closeBtn').addEventListener('click', ()=>{
    overlayEl.classList.add('hidden');
    document.body.style.overflow = '';
    currentRecipeId = null;
    renderView();
  });
  overlayEl.classList.remove('hidden');
  document.body.style.overflow = 'hidden';

  refreshComments(id);

  const savedName = await getSavedName();
  if(savedName) document.getElementById('commentName').value = savedName;

  document.getElementById('submitComment').addEventListener('click', async ()=>{
    const nameInput = document.getElementById('commentName');
    const textInput = document.getElementById('commentText');
    const errorEl = document.getElementById('formError');
    const name = nameInput.value.trim();
    const text = textInput.value.trim();
    errorEl.style.display = 'none';

    if(!name){
      errorEl.textContent = 'Elegí tu nombre de la lista.';
      errorEl.style.display = 'block';
      return;
    }
    if(!text){
      errorEl.textContent = 'Escribí un comentario.';
      errorEl.style.display = 'block';
      return;
    }

    const btn = document.getElementById('submitComment');
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    try{
      await saveComment(id, name, text);
      await saveName(name);
      textInput.value = '';
      await refreshComments(id);
    }catch(e){
      console.error('Error al guardar comentario:', e);
      errorEl.textContent = 'No se pudo guardar el comentario: ' + (e.message || e);
      errorEl.style.display = 'block';
    }
    btn.disabled = false;
    btn.textContent = 'Comentar';
  });
}

function isLikelyExtensionInterference(e){
  const msg = (e && (e.name || '') + ' ' + (e.message || '')) || '';
  return /DataCloneError/i.test(msg) || /postMessage/i.test(msg);
}

async function withExtensionRetry(fn){
  try{
    return await fn();
  }catch(e){
    if(isLikelyExtensionInterference(e)){
      // Probablemente una extensión del navegador (antivirus/seguridad) está
      // interceptando el fetch y rompiendo la promesa. Reintentamos una vez.
      await new Promise(r => setTimeout(r, 150));
      return await fn();
    }
    throw e;
  }
}

async function commentCount(recipeId){
  if(!supabaseClient) return 0;
  try{
    return await withExtensionRetry(async () => {
      const { count, error } = await supabaseClient
        .from('comments')
        .select('id', { count: 'exact', head: true })
        .eq('recipe_id', recipeId);
      if(error) throw error;
      return count || 0;
    });
  }catch(e){
    if(isLikelyExtensionInterference(e)){
      console.warn('commentCount: interferencia de extensión del navegador, se omite el contador.');
    } else {
      console.error('commentCount error: ' + (e && (e.message || e.details || e.hint || e.code) || JSON.stringify(e)));
    }
    return 0;
  }
}

async function renderTalleresGrid(){
  const term = normalize(searchTerm.trim());
  if(activeTaller==='all' && term===''){
    gridEl.innerHTML = TALLERES.map(t=>{
      const nR = RECIPES.filter(r=>tallerOf(r)===t.id).length;
      const nF = FUNDAMENTOS.filter(f=>tallerOf(f)===t.id).length;
      return `
      <div class="card" style="--cat-color:var(--fundamentos)" data-taller-id="${t.id}">
        <p class="cat-label">Taller</p>
        <h3>${t.label}</h3>
        ${t.guest ? `<p class="meta">Invitado/a: ${t.guest}</p>` : ''}
        <p class="ing-preview">${nF>0 ? nF+' '+(nF===1?'fundamento':'fundamentos')+' · ' : ''}${nR} ${nR===1?'receta':'recetas'}</p>
      </div>`;
    }).join('');
    gridEl.querySelectorAll('.card').forEach(card=>{
      card.addEventListener('click', ()=>{ activeTaller = card.dataset.tallerId; renderChips(); renderView(); window.scrollTo({top:0}); });
    });
    return;
  }
  const talleres = TALLERES.filter(t=>activeTaller==='all' || activeTaller===t.id);
  let html = '';
  const countIds = [];
  talleres.forEach(t=>{
    const recs = RECIPES.filter(r=>tallerOf(r)===t.id && (term==='' || ingredientsText(r).includes(term) || normalize(r.title).includes(term)));
    const funds = term==='' ? FUNDAMENTOS.filter(f=>tallerOf(f)===t.id) : [];
    if(recs.length===0 && funds.length===0) return;
    html += `<h2 class="taller-head">${t.label}</h2>`;
    if(funds.length) html += `<p class="taller-sub">Fundamentos (teoría)</p>`;
    funds.forEach(f=>{
      countIds.push(f.id);
      html += `
      <div class="card" style="--cat-color:var(--fundamentos)" data-fund-id="${f.id}">
        <p class="cat-label">Fundamentos</p>
        <h3>${f.title}</h3>
        <p class="meta">${f.classInfo}</p>
        <p class="ing-preview">${f.sections.map(s=>s.title).join(' · ')}</p>
        <p class="comment-count" data-count-for="${f.id}"></p>
      </div>`;
    });
    if(recs.length) html += `<p class="taller-sub">Recetas</p>`;
    recs.forEach(r=>{
      countIds.push(r.id);
      const cat = categoryOf(r.category);
      html += `
      <div class="card" style="--cat-color:${cat.color}" data-id="${r.id}">
        <p class="cat-label">${recipeCatLabel(r)}</p>
        <h3>${r.title}</h3>
        <p class="meta">${r.classInfo}</p>
        <p class="ing-preview">${r.ingredientGroups.map(g=>g.items.join(', ')).join(', ')}</p>
        <p class="comment-count" data-count-for="${r.id}"></p>
      </div>`;
    });
  });
  if(html===''){
    gridEl.innerHTML = `<div class="empty-state"><h3>No hay resultados</h3><p>Probá con otro ingrediente o taller.</p></div>`;
    return;
  }
  gridEl.innerHTML = html;
  gridEl.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>{
      if(card.dataset.fundId) openFundamentoDetail(card.dataset.fundId);
      else openDetail(card.dataset.id);
    });
  });
  countIds.forEach(async id=>{
    const n = await commentCount(id);
    const el = gridEl.querySelector(`[data-count-for="${id}"]`);
    if(el) el.textContent = n===0 ? 'Sin comentarios todavía' : (n===1 ? '1 comentario' : n+' comentarios');
  });
}

async function renderGrid(){
  const term = normalize(searchTerm.trim());
  let filtered = RECIPES.filter(r=>{
    if(tallerOf(r)) return false;
    const catOk = activeCategory==='all' || recipeCats(r).includes(activeCategory);
    const searchOk = term==='' || ingredientsText(r).includes(term) || normalize(r.title).includes(term);
    return catOk && searchOk;
  });

  if(filtered.length===0){
    gridEl.innerHTML = `<div class="empty-state"><h3>No hay recetas</h3><p>Probá con otro ingrediente o categoría.</p></div>`;
    return;
  }

  gridEl.innerHTML = filtered.map(r=>{
    const cat = categoryOf(r.category);
    const preview = r.ingredientGroups.map(g=>g.items.join(', ')).join(', ');
    return `
      <div class="card" style="--cat-color:${cat.color}" data-id="${r.id}">
        <p class="cat-label">${recipeCatLabel(r)}</p>
        <h3>${r.title}</h3>
        <p class="meta">${r.classInfo}</p>
        <p class="ing-preview">${preview}</p>
        <p class="comment-count" data-count-for="${r.id}"></p>
      </div>
    `;
  }).join('');

  gridEl.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=> openDetail(card.dataset.id));
  });

  filtered.forEach(async r=>{
    const n = await commentCount(r.id);
    const el = gridEl.querySelector(`[data-count-for="${r.id}"]`);
    if(el) el.textContent = n===0 ? 'Sin comentarios todavía' : (n===1 ? '1 comentario' : n+' comentarios');
  });
}

async function loadComments(recipeId){
  if(!supabaseClient) return [];
  try{
    return await withExtensionRetry(async () => {
      const { data, error } = await supabaseClient
        .from('comments')
        .select('name, text, created_at')
        .eq('recipe_id', recipeId)
        .order('created_at', { ascending: false });
      if(error) throw error;
      return (data || []).map(c => ({ name: c.name, text: c.text, ts: new Date(c.created_at).getTime() }));
    });
  }catch(e){
    if(isLikelyExtensionInterference(e)){
      console.warn('loadComments: interferencia de extensión del navegador, se omite la carga.');
    } else {
      console.error('loadComments error: ' + (e && (e.message || e.details || e.hint || e.code) || JSON.stringify(e)));
    }
    return [];
  }
}

async function saveComment(recipeId, name, text){
  if(!supabaseClient) throw new Error('No se pudo conectar con el servicio de comentarios. Recargá la página e intentá de nuevo.');
  await withExtensionRetry(async () => {
    const { error } = await supabaseClient
      .from('comments')
      .insert({ recipe_id: recipeId, name, text });
    if(error) throw error;
  });
}

async function getSavedName(){
  try{
    return localStorage.getItem('gaucha-recetario-username') || '';
  }catch(e){
    return '';
  }
}
async function saveName(name){
  try{
    localStorage.setItem('gaucha-recetario-username', name);
  }catch(e){}
}

function formatDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('es-ES', { day:'numeric', month:'short' }) + ' · ' + d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
}

async function openDetail(id){
  const recipe = RECIPES.find(r=>r.id===id);
  if(!recipe) return;
  currentRecipeId = id;
  const cat = categoryOf(recipe.category);

  const ingGroupsHtml = recipe.ingredientGroups.map(g=>`
    <div class="ing-group">
      ${recipe.ingredientGroups.length>1 ? `<p class="grp-title">${g.title}</p>` : ''}
      <ul>${g.items.map(i=>`<li>${i}</li>`).join('')}</ul>
    </div>
  `).join('');

  const stepsHtml = recipe.steps.map(s=>`<p>${s}</p>`).join('');

  detailEl.innerHTML = `
    <div class="detail-head" style="--cat-color:${cat.color}">
      <button class="close" id="closeBtn" aria-label="Cerrar">&times;</button>
      <p class="cat-label">${recipeCatLabel(recipe)}</p>
      <h2>${recipe.title}</h2>
      <p class="meta">${recipe.classInfo}</p>
    </div>
    <div class="detail-body">
      ${recipe.intro ? `<p class="recipe-intro">${recipe.intro}</p>` : ''}
      <section>
        <h4>Ingredientes</h4>
        ${ingGroupsHtml}
      </section>
      <section class="steps">
        <h4>Preparación</h4>
        ${stepsHtml}
      </section>
      <section>
        ${recipe.techNote ? `<div class="tech-note" style="--cat-color:${cat.color}">
          <strong>Fundamento técnico</strong>
          ${recipe.techNote}
        </div>` : ''}
        ${recipe.tips && recipe.tips.length ? `
        <div class="tip-gaucha">
          <strong>💡 Tip Gaucha</strong>
          <ul>${recipe.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
        </div>` : ''}
      </section>
    </div>
    <div class="comments-section">
      <h4 style="border:none; margin-bottom:12px;">Comentarios de la clase</h4>
      <div id="commentsList"></div>
      <div class="comment-form">
        <select id="commentName">
          <option value="" disabled selected>Elegí tu nombre</option>
          ${COMMENTERS.map(n=>`<option value="${n}">${n}</option>`).join('')}
        </select>
        <textarea id="commentText" placeholder="Contá cómo te salió, qué le cambiarías, tips..."></textarea>
        <p class="form-note" id="formError" style="display:none; color:#8B3A2B;"></p>
        <button id="submitComment">Comentar</button>
      </div>
    </div>
  `;

  document.getElementById('closeBtn').addEventListener('click', closeDetail);
  overlayEl.classList.remove('hidden');
  document.body.style.overflow = 'hidden';

  refreshComments(id);

  const savedName = await getSavedName();
  if(savedName) document.getElementById('commentName').value = savedName;

  document.getElementById('submitComment').addEventListener('click', async ()=>{
    const nameInput = document.getElementById('commentName');
    const textInput = document.getElementById('commentText');
    const errorEl = document.getElementById('formError');
    const name = nameInput.value.trim();
    const text = textInput.value.trim();
    errorEl.style.display = 'none';

    if(!name){
      errorEl.textContent = 'Elegí tu nombre de la lista.';
      errorEl.style.display = 'block';
      return;
    }
    if(!text){
      errorEl.textContent = 'Escribí un comentario.';
      errorEl.style.display = 'block';
      return;
    }

    const btn = document.getElementById('submitComment');
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    try{
      await saveComment(id, name, text);
      await saveName(name);
      textInput.value = '';
      await refreshComments(id);
    }catch(e){
      console.error('Error al guardar comentario:', e);
      errorEl.textContent = 'No se pudo guardar el comentario: ' + (e.message || e);
      errorEl.style.display = 'block';
    }
    btn.disabled = false;
    btn.textContent = 'Comentar';
  });
}

async function refreshComments(id){
  const listEl = document.getElementById('commentsList');
  if(!listEl) return;
  const comments = await loadComments(id);
  if(comments.length===0){
    listEl.innerHTML = `<p class="no-comments">Todavía no hay comentarios. Sé el primero en dejar un tip.</p>`;
    return;
  }
  listEl.innerHTML = comments
    .sort((a,b)=>b.ts-a.ts)
    .map(c=>`
      <div class="comment">
        <p class="who">${c.name}<span>${formatDate(c.ts)}</span></p>
        <p class="txt">${c.text}</p>
      </div>
    `).join('');
}

function closeDetail(){
  overlayEl.classList.add('hidden');
  document.body.style.overflow = '';
  currentRecipeId = null;
  renderView();
}

overlayEl.addEventListener('click', (e)=>{
  if(e.target === overlayEl) closeDetail();
});

searchInput.addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  renderView();
});

renderChips();
renderView();
</script>
</body>
</html>
